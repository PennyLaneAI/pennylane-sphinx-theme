name: Formatting Check
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  format:
    runs-on: pl-2-core-gh-runner

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run formatters
        run: make format

      - name: Run linters
        run: make lint
